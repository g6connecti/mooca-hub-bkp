<h2>Clínicas e Hospitais Veterinários na Mooca</h2>

<!-- CSS interno para padronizar cores e botões -->
<style>
  #conteudo, body {
    background: #2a2a2a;
    color: #e0e0e0;
  }
  p, small, h2, h3 {
    color: #e0e0e0;
  }
  .lista-estabelecimentos button {
    background: #00ffff;
    color: #121212;
    box-shadow: 0 0 8px #00ffff;
    margin: 8px 0;
    padding: 12px;
    border: none;
    border-radius: 8px;
    width: 100%;
    text-align: left;
    font-size: 1em;
    transition: all 0.3s;
  }
  .lista-estabelecimentos button:hover {
    background: #00e6e6;
    box-shadow: 0 0 15px #00ffff;
    transform: translateY(-2px);
  }
  .close-btn {
    background: #00ffff;
    color: #121212;
    box-shadow: 0 0 10px #00ffff;
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s;
  }
  .close-btn:hover {
    background: #00e6e6;
    box-shadow: 0 0 20px #00ffff;
  }
</style>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchClinicas" placeholder="Pesquisar clínica ou hospital..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<!-- Mensagem de nenhum resultado -->
<p id="noResultClinicas" style="text-align:center; color:#ff4444; font-size:1em; margin:10px 0; display:none;">
  Nenhuma clínica encontrada.
</p>

<p style="text-align:center; margin-bottom:20px; font-size:1.1em; color:#00ffff;">
  Consultas, emergências 24h, cirurgias e cuidados especializados para o seu pet!
</p>

<div class="lista-estabelecimentos">

  <!-- Hospitais Veterinários -->
  <p class="section-separator" style="color:#00ffff; font-weight:bold; margin:30px 0 15px;">
    Hospitais Veterinários
  </p>

  <button class="seguranca-btn" onclick="window.open('https://animaniacs.com.br', '_blank')">
    Hospital Veterinário Animaniac's (Unidade Mooca)<br>
    <small>Rua Juventus, 467</small><br>
    <small>Site: animaniacs.com.br</small>
  </button>

  <!-- Adicione aqui os outros botões de clínicas/hospitais conforme necessário -->

</div>

<button class="close-btn" onclick="fecharModulo()">Fechar</button>
