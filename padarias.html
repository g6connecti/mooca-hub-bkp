<h2>Padarias na Mooca< v-2/h2>
<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Padarias..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.lista-estabelecimentos button');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? '' : 'none';
    });
  });
</script>
<div class="lista-estabelecimentos">
  <!-- Carillo -->
  <div class="padaria-bloco destaque">
    <button class="padaria-btn destaque" onclick="window.open('https://padariacarillo.com.br/cardapio/', '_blank')">
      <span class="selo-dourado">★ Destaque</span>
      Padaria Carillo <span class="promo-tag">Promoção</span>
    </button>
    <p class="promo-texto">
      Menu del Giorno seg-sex: almoço completo (entrada + principal + acompanhamento) R$ 35,00
    </p>
  </div>
  
  <button class="padaria-btn" onclick="window.open('https://montelibanopaes.com', '_blank')">

  <button class="padaria-btn" onclick="window.open('https://dicunto.com.br', '_blank')">

  <!-- Santa Branca -->

<style>
  .padaria-bloco {
    margin-bottom: 20px;
    position: relative; /* necessário para o selo */
  }

  .padaria-btn {
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.08); /* verde-água mais bonito e sutil */
    border: 1px solid #00d4ff; /* borda verde-água elegante */
    color: #ffffff; /* texto branco para legibilidade */
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 1em;
    position: relative; /* para o selo ficar sobre o botão */
  }

  .padaria-btn:hover {
    background: rgba(0, 212, 255, 0.15); /* um pouco mais visível no hover */
    transform: translateY(-3px);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }

  .promo-tag {
    background: #ff9800;
    color: #121212;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 0.78em;
    font-weight: bold;
    margin-left: 10px;
    vertical-align: middle;
    box-shadow: 0 1px 6px rgba(255, 152, 0, 0.5);
    display: inline-block;
  }

  .padaria-btn:hover .promo-tag {
    background: #ffb74d;
    transform: scale(1.05);
    transition: all 0.2s ease;
  }

  .promo-texto {
    font-size: 0.85em;
    color: #ff9800;
    margin: 6px 0 0 15px;
    line-height: 1.4;
  }

  /* === Destaque Premium corrigido para Padaria Carillo === */

  /* Borda pulsante apenas no bloco inteiro (sem sobrepor) */
  .padaria-bloco.destaque {
    border: 3px solid #00d4ff;
    border-radius: 14px;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    animation: pulse-borda 2.8s infinite ease-in-out;
    padding: 2px; /* pequeno espaço interno para não colar o botão na borda */
    position: relative; /* necessário para o selo */
    overflow: visible; /* permite que o selo saia do bloco */
  }

  /* Animação da borda pulsante */
  @keyframes pulse-borda {
    0% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
    50% { box-shadow: 0 0 35px rgba(0, 212, 255, 0.85); }
    100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
  }

  /* Selo dourado agora posicionado FORA da borda (acima e à direita) */
  .selo-dourado {
    position: absolute;
    top: -28px;               /* mais alto para ficar acima da borda */
    right: -10px;             /* um pouco para fora à direita */
    background: linear-gradient(135deg, #ffd700, #ffeb3b);
    color: #1a1a1a;
    font-weight: bold;
    font-size: 0.95em;
    padding: 6px 16px;
    border-radius: 24px;
    box-shadow: 0 4px 16px rgba(255, 215, 0, 0.7);
    transform: rotate(10deg);
    z-index: 20;              /* fica acima de tudo */
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* Efeito hover no selo (mais chamativo) */
  .padaria-bloco.destaque:hover .selo-dourado {
    transform: rotate(10deg) scale(1.12);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 1);
    top: -30px; /* sobe um pouquinho no hover */
  }

  /* Reforço no botão destaque (para combinar com a borda) */
  .padaria-btn.destaque {
    background: rgba(0, 212, 255, 0.12) !important;
    border: 2px solid #00d4ff !important;
  }

  .padaria-btn.destaque:hover {
    background: rgba(0, 212, 255, 0.22) !important;
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.7) !important;
  }
</style>
