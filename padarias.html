<h2>Padarias na Mooca V-4</h2>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Padarias..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.padaria-btn');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? 'flex' : 'none';
    });
  });
</script>

<div class="lista-estabelecimentos">
  
  <!-- Padaria Carillo (Com destaque Neon e Promoção Interna) -->
  <button class="padaria-btn destaque-neon" onclick="window.open('https://padariacarillo.com.br', '_blank')">
    <div class="btn-linha-topo">
      <strong>Padaria Carillo</strong> <span class="promo-tag">Promoção</span>
    </div>
    <span class="promo-texto-interno">
      Menu del Giorno seg-sex: almoço completo R$ 35,00
    </span>
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://montelibanopaes.com', '_blank')">
    Panificadora Monte Líbano
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://dicunto.com.br', '_blank')">
    Di Cunto
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://maps.app.goo.gl', '_blank')">
    Grano Mooca
  </button>
  
  <!-- Santa Branca (Sem Neon, mas com Promoção Interna no padrão) -->
  <button class="padaria-btn" onclick="window.open('https://padariasantabranca.com.br', '_blank')">
    <div class="btn-linha-topo">
      <strong>Padaria Santa Branca</strong> <span class="promo-tag">Promoção</span>
    </div>
    <span class="promo-texto-interno">
      Diversas ofertas diárias em pães e lanches – verifique no local
    </span>
  </button>

  <button class="padaria-btn" onclick="window.open('https://share.google', '_blank')">
    Panetteria 77
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://maps.app.goo.gl', '_blank')">
    Padaria Estoril
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://www.padariapanrico.com.br', '_blank')">
    Padaria Panrico
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://share.google', '_blank')">
    Padaria Romaria
  </button>

  <button class="padaria-btn" onclick="window.open('https://padariafalcao.shop', '_blank')">
    Padaria Falcão
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://linktr.ee', '_blank')">
    Padaria Viana do Castelo
  </button>
</div>

<button class="close-btn" onclick="fecharModulo()">Fechar</button>

<style>
  .lista-estabelecimentos {
    display: flex;
    flex-direction: column;
    gap: 10px; /* Espaçamento padrão entre botões */
  }

  .padaria-btn {
    width: 100%;
    text-align: left;
    padding: 12px 18px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.08); /* Fundo padrão */
    border: 1px solid #00d4ff; /* Borda padrão */
    color: #ffffff;
    transition: all 0.3s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    text-decoration: none;
  }

  .btn-linha-topo {
    display: flex;
    align-items: center;
    font-size: 1em;
  }

  /* Texto laranja de promoção */
  .promo-texto-interno {
    font-size: 0.82em;
    color: #ff9800;
    margin-top: 4px;
    font-weight: normal;
  }

  .promo-tag {
    background: #ff9800;
    color: #121212;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.7em;
    font-weight: bold;
    margin-left: 10px;
  }

  /* Efeito de Destaque Neon (Único contorno) */
  .destaque-neon {
    border: 2px solid #00d4ff !important;
    background: rgba(0, 212, 255, 0.15) !important;
    animation: glow-unico 3s infinite ease-in-out;
  }

  @keyframes glow-unico {
    0% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.3); }
    50% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.6); }
    100% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.3); }
  }

  .padaria-btn:hover {
    background: rgba(0, 212, 255, 0.2);
    transform: translateY(-2px);
  }
</style>
