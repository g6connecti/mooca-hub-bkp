<h2>Padarias na Mooca V-2</h2>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Padarias..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.lista-estabelecimentos button');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? '' : 'none';
    });
  });
</script>

<div class="lista-estabelecimentos">
  <!-- Carillo - com destaque -->
  <div class="padaria-bloco destaque">
    <button class="padaria-btn destaque" onclick="window.open('https://padariacarillo.com.br/cardapio/', '_blank')">

    <p class="promo-texto">

<style>
  .padaria-bloco {
    margin-bottom: 20px;
    position: relative;
  }

  .padaria-btn {
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.08);
    border: 1px solid #00d4ff;
    color: #ffffff;
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 1em;
    position: relative;
  }

  .padaria-btn:hover {
    background: rgba(0, 212, 255, 0.15);
    transform: translateY(-3px);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }

  .promo-tag {
    background: #ff9800;
    color: #121212;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 0.78em;
    font-weight: bold;
    margin-left: 10px;
    vertical-align: middle;
    box-shadow: 0 1px 6px rgba(255, 152, 0, 0.5);
    display: inline-block;
  }

  .padaria-btn:hover .promo-tag {
    background: #ffb74d;
    transform: scale(1.05);
    transition: all 0.2s ease;
  }

  .promo-texto {
    font-size: 0.85em;
    color: #ff9800;
    margin: 6px 0 0 15px;
    line-height: 1.4;
  }

  /* Destaque corrigido - borda pulsante sem duplicação */
  .padaria-bloco.destaque {
    border-radius: 14px;
    background: rgba(0, 212, 255, 0.03); /* fundo sutil para destacar o bloco */
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    animation: pulse-glow 3s infinite ease-in-out;
    padding: 12px; /* espaço interno maior para evitar colisão */
  }

  @keyframes pulse-glow {
    0% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
    50% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.8); }
    100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
  }

  /* Selo dourado posicionado FORA e ACIMA do bloco inteiro */
  .selo-dourado {
    position: absolute;
    top: -36px;               /* bem acima da borda */
    right: 20px;              /* afastado da direita */
    background: linear-gradient(135deg, #ffd700, #ffeb3b);
    color: #1a1a1a;
    font-weight: bold;
    font-size: 1em;
    padding: 6px 18px;
    border-radius: 30px;
    box-shadow: 0 5px 18px rgba(255, 215, 0, 0.7);
    transform: rotate(8deg);
    z-index: 30;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    border: 1px solid #ffeb3b;
  }

  /* Hover no selo */
  .padaria-bloco:hover .selo-dourado {
    transform: rotate(8deg) scale(1.1);
    box-shadow: 0 8px 30px rgba(255, 215, 0, 0.9);
    top: -38px;
  }

  /* Reforço no botão destaque */
  .padaria-btn.destaque {
    background: rgba(0, 212, 255, 0.15) !important;
    border: 2px solid #00d4ff !important;
  }

  .padaria-btn.destaque:hover {
    background: rgba(0, 212, 255, 0.25) !important;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.7) !important;
  }
</style>
