<h2>Padarias na Mooca V-3</h2>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Padarias..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.padaria-btn');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? 'flex' : 'none';
    });
  });
</script>

<div class="lista-estabelecimentos">
  <!-- Carillo - Destaque com texto interno -->
  <div class="padaria-bloco destaque">
    <button class="padaria-btn destaque" onclick="window.open('https://padariacarillo.com.br/cardapio/', '_blank')">
      <div class="btn-linha-topo">
        <strong>Padaria Carillo</strong> <span class="promo-tag">Promoção</span>
      </div>
      <span class="promo-texto-interno">
        Menu del Giorno seg-sex: almoço completo (entrada + principal + acompanhamento) R$ 35,00
      </span>
    </button>
  </div>
  
  <button class="padaria-btn" onclick="window.open('https://montelibanopaes.com', '_blank')">
    Panificadora Monte Líbano
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://dicunto.com.br', '_blank')">
    Di Cunto
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://maps.app.goo.gl/CtXfURkFBKNg8m5E9', '_blank')">
    Grano Mooca
  </button>
  
  <!-- Santa Branca - Destaque com texto interno -->
  <div class="padaria-bloco">
    <button class="padaria-btn" onclick="window.open('https://padariasantabranca.com.br', '_blank')">
      <div class="btn-linha-topo">
        <strong>Padaria Santa Branca</strong> <span class="promo-tag">Promoção</span>
      </div>
      <span class="promo-texto-interno">
        Diversas ofertas diárias em pães e lanches – verifique no local ou Instagram
      </span>
    </button>
  </div>

  <button class="padaria-btn" onclick="window.open('https://share.google/ox1FXGpCZpDIXC27Q', '_blank')">
    Panetteria 77
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://maps.app.goo.gl/mVRwFCL3UpJTZPkbA', '_blank')">
    Padaria Estoril
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://www.padariapanrico.com.br/', '_blank')">
    Padaria Panrico
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://share.google/zZkkuJIoZND4Jvdhc', '_blank')">
    Padaria Romaria

  <button class="padaria-btn" onclick="window.open('https://padariafalcao.shop', '_blank')">
    Padaria Falcão
  </button>
  
  <button class="padaria-btn" onclick="window.open('https://linktr.ee/padaria.vianadocastelo', '_blank')">
    Padaria Viana do Castelo
  </button>
</div>

<button class="close-btn" onclick="fecharModulo()">Fechar</button>

<style>
  .lista-estabelecimentos {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .padaria-bloco {
    position: relative;
    width: 100%;
  }

  .padaria-btn {
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.08);
    border: 1px solid #00d4ff;
    color: #ffffff;
    transition: all 0.3s ease;
    cursor: pointer;
    font-size: 1em;
    display: flex; /* Altera para flex para empilhar textos */
    flex-direction: column;
    gap: 5px;
  }

  .btn-linha-topo {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .padaria-btn:hover {
    background: rgba(0, 212, 255, 0.15);
    transform: translateY(-3px);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }

  .promo-tag {
    background: #ff9800;
    color: #121212;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.7em;
    font-weight: bold;
    margin-left: 10px;
    box-shadow: 0 1px 6px rgba(255, 152, 0, 0.5);
  }

  /* Novo estilo para o texto laranja dentro do botão */
  .promo-texto-interno {
    font-size: 0.85em;
    color: #ff9800;
    font-weight: normal;
    line-height: 1.3;
    margin-top: 2px;
  }

  /* Destaque sutil com glow pulsante */
  .padaria-bloco.destaque {
    border-radius: 14px;
    animation: glow-suave 4s infinite ease-in-out;
  }

  @keyframes glow-suave {
    0% { box-shadow: 0 0 8px rgba(0, 212, 255, 0.2); }
    50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
    100% { box-shadow: 0 0 8px rgba(0, 212, 255, 0.2); }
  }

  .padaria-btn.destaque {
    background: rgba(0, 212, 255, 0.12) !important;
    border: 2px solid #00d4ff !important;
  }
</style>
