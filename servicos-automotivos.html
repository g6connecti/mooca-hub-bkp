<!-- Patrocínio no topo (logo à esquerda + texto) -->
<div style="display: flex; align-items: center; justify-content: center; margin: 15px 0 25px 0; background: rgba(0, 212, 255, 0.08); padding: 12px; border-radius: 12px; border: 1px solid #00d4ff;">
  <a href="https://pointglass.com.br/" target="_blank" style="margin-right: 15px; display: block;">
    <img src="pointglass160x50.png" alt="Point Glass Vidros Automotivos" 
         style="width: 160px; height: 50px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,212,255,0.3);">
  </a>
  <p style="font-size: 1em; color: #00ffff; margin: 0; text-align: center;">
    Esse Módulo é Patrocinado pela<br><strong>Point Glass Vidros Automotivos</strong>
  </p>
</div>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Serviços Automotivos..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.lista-estabelecimentos button');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? '' : 'none';
    });
  });
</script>

<!-- Áudio do patrocinador (toca ao carregar o módulo) -->
<audio id="pointGlassAudio" src="pglass.mp3" preload="auto"></audio>

<script>
  // Toca o áudio do patrocinador ao carregar o módulo
  window.addEventListener('load', function() {
    const audio = document.getElementById('pointGlassAudio');
    if (audio) {
      audio.volume = 0.4; // volume baixo para não assustar
      audio.muted = true; // workaround mobile
      const playPromise = audio.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            audio.muted = false; // desmuta após iniciar
            console.log('Áudio Point Glass tocando');
          })
          .catch(() => {
            // Segunda tentativa (comum no mobile)
            audio.muted = false;
            audio.play().catch(e => console.log('Áudio Point Glass falhou:', e.message));
          });
      }
    }
  });
</script>
