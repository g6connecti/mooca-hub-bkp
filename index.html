<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mooca Hub - Tudo do Bairro na Palma da Mão</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cordova.js"></script>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('campo-juventos.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      color: #f0f0f0;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #FF5722;
      font-size: 2.5em;
      text-shadow: 0 0 10px #FF5722, 0 0 20px rgba(255, 87, 34, 0.6);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 40px auto;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0, 255, 255, 0.3);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffff, 0 0 50px rgba(0, 255, 255, 0.7);
    }
    .card h2 {
      margin: 10px 0 0;
      font-size: 1.2em;
      color: #00ff00;
      text-shadow: 0 0 5px #00ff00;
    }
    .emoji {
      font-size: 3.5em;
      margin-bottom: 10px;
    }
    #conteudo {
      margin: 20px auto;
      padding: 20px;
      background: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 0 20px #00ffff;
      max-width: 1200px;
      min-height: 60vh;
    }
    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95em;
      transition: all 0.3s;
      text-align: center;
    }
    .acougue-btn, .emporio-btn, .padaria-btn, .farm-btn, .farm-comum-btn, .hamburguer-btn, .mercado-btn, .restaurante-btn, .noticias-btn, .lazer-btn {
      background: #00ffff;
      color: #121212;
      box-shadow: 0 0 8px #00ffff;
    }
    .acougue-btn:hover, .emporio-btn:hover, .padaria-btn:hover,
    .farm-btn:hover, .farm-comum-btn:hover, .hamburguer-btn:hover,
    .mercado-btn:hover, .restaurante-btn:hover, .noticias-btn:hover, .lazer-btn:hover {
      background: #00ff00;
      box-shadow: 0 0 15px #00ff00;
      transform: translateY(-2px);
    }
    .close-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #00ffff;
      color: #000000;
      box-shadow: 0 0 10px #00ffff;
      font-size: 1em;
    }
    .close-btn:hover {
      background: #00e6e6;
      box-shadow: 0 0 20px #00ffff;
    }
    .sugestao-email {
      color: #81d4fa;
      font-weight: bold;
      text-decoration: none;
    }
    .sugestao-email:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    iframe.map-embed {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
    }
    .weather-box {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin: 15px 0;
    }
    .temp {
      font-size: 2.2em;
      font-weight: bold;
    }
    .cold { color: #81d4fa; }
    .mild { color: #FF9800; }
    .hot { color: #f44336; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }
    table th, table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    table th {
      background: #333;
      color: #00ff00;
    }
    table tr:hover {
      background: #333;
    }
    .overflow-x {
      overflow-x: auto;
    }
    .lista-estabelecimentos {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .lista-estabelecimentos::-webkit-scrollbar {
      width: 8px;
    }
    .lista-estabelecimentos::-webkit-scrollbar-thumb {
      background: #00ffff;
      border-radius: 4px;
    }
    .estabelecimentos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      padding: 10px;
    }
    .estabelecimento-card {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid #00ffff;
      transition: all 0.3s;
    }
    .estabelecimento-card:hover {
      background: #00ffff22;
      transform: translateY(-4px);
      box-shadow: 0 0 15px #00ffff;
    }
    .section-separator {
      font-size: 1.2em;
      color: #00ffff;
      margin: 30px 0 15px;
      text-align: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    .bolinha {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 12px;
      vertical-align: middle;
    }
    .bolinha.ativa {
      background: #00ff00;
      box-shadow: 0 0 12px #00ff00, 0 0 20px rgba(0, 255, 0, 0.7);
      animation: piscar 1.2s infinite;
    }
    .bolinha.inativa {
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
    }
    @keyframes piscar {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .apoio-lista {
      list-style-type: disc;
      padding-left: 30px;
      margin: 15px 0;
      line-height: 1.6;
    }
    .apoio-lista li {
      margin-bottom: 10px;
    }
    .apoio-link {
      color: #00ffff;
      text-decoration: none;
    }
    .apoio-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    #map, #lazer-map {
      height: 400px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .lazer-item {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #00ffff;
    }
    .lazer-item h3 {
      color: #00ff00;
      margin: 0 0 8px;
    }
    .lazer-item p {
      margin: 5px 0;
      font-size: 0.95em;
    }

    /* Splash de apoiadores */
    #splash-apoio {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('fabrica.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      overflow-y: auto;
    }
    .container-apoio {
      max-width: 1000px;
      width: 90%;
      padding: 20px 15px;
      text-align: center;
    }
    .apoio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .apoio-btn {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 12px 16px;
      text-decoration: none;
      color: white;
      box-shadow: 0 0 10px #00ffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      min-height: 140px;
      justify-content: center;
    }
    .apoio-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ff00;
    }
    .apoio-btn img {
      width: 90px;
      height: auto;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .apoio-btn span {
      font-size: 0.95em;
      line-height: 1.3;
      text-align: center;
    }
    .continuar-btn {
      background: #00ffff;
      color: #121212;
      font-size: 1.1em;
      padding: 12px 35px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff;
      margin-top: 30px;
      transition: all 0.3s ease;
      min-width: 240px;
    }
    .continuar-btn:hover {
      background: #00e6e6;
      box-shadow: 0 0 25px #00ffff;
      transform: scale(1.05);
    }

    .contador-box {
      text-align: center;
      margin: 12px auto;
      padding: 8px 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid #333;
      border-radius: 8px;
      max-width: 280px;
      box-shadow: none;
      font-size: 1em;
      color: #aaa;
    }
    .contador-box p {
      margin: 0 8px 0 0;
      font-size: 1.1em;
      color: #ccc;
      display: inline;
    }
    .contador-box .counter {
      font-size: 1.6em;
      font-weight: bold;
      color: #88ffaa;
      text-shadow: none;
      display: inline;
    }

    @media (max-width: 600px) {
      .apoio-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .apoio-btn img {
        width: 80px;
      }
      .container-apoio {
        padding: 15px 10px;
      }
      h1 {
        font-size: 1.8em;
      }
      .contador-box {
        max-width: 240px;
        font-size: 0.95em;
        padding: 6px 12px;
      }
      .contador-box p {
        font-size: 1em;
      }
      .contador-box .counter {
        font-size: 1.4em;
      }
    }

    /* Botão Sair do Aplicativo - verde-água, texto preto, tamanho reduzido */
    .exit-btn {
      background: #00ffff !important;
      color: #000000 !important;
      font-size: 0.95em;
      padding: 10px 20px;
      border: 1px solid #00ffff;
      border-radius: 10px;
      cursor: pointer;
      margin: 40px auto 30px;
      display: block;
      width: 60%;
      max-width: 220px;
      transition: all 0.3s ease;
      box-shadow: none;
      text-align: center;
    }
    .exit-btn:hover {
      background: #00e6e6 !important;
      color: #000000 !important;
      box-shadow: 0 0 15px #00ffff;
      transform: scale(1.03);
    }

    /* Botões de Segurança (Vigia Mooca e Alertas Cidade) */
    .seguranca-btn, .vigia-btn, .emergencia-btn {
      background: #00ffff !important;
      color: #000000 !important;
      box-shadow: 0 0 8px #00ffff;
      margin: 8px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      font-size: 1em;
      transition: all 0.3s;
    }
    .seguranca-btn:hover, .vigia-btn:hover, .emergencia-btn:hover {
      background: #00e6e6 !important;
      box-shadow: 0 0 15px #00ffff;
      transform: translateY(-2px);
    }
    .seguranca-btn small, .vigia-btn small, .emergencia-btn small {
      color: #111111 !important;
    }
  </style>
</head>
<body>

  <!-- Seu splash de apoiadores permanece igual -->
  <div id="splash-apoio">
    <!-- ... todo o conteúdo do splash ... -->
  </div>

  <!-- Conteúdo principal -->
  <div id="conteudo-principal" style="display:none;">
    <header>
      <h1>Mooca Hub - Tudo do Bairro na Palma da Mão</h1>
      <div class="contador-box">
        <p>Visitantes:</p>
        <span class="counter">
          <script src="https://cdn.counter.dev/script.js?v=3" data-id="92a2e01e-12d3-4167-a8d6-09bcb987d9c0" data-utcoffset="-3"></script>
        </span>
      </div>
    </header>

    <div class="grid">
      <!-- Todos os cards permanecem iguais -->
      <!-- ... -->
    </div>

    <div id="conteudo" style="display: none;">
      <!-- Aqui carregam os módulos -->
    </div>

    <!-- Botão Sair corrigido -->
    <button class="exit-btn" onclick="sairDoApp()">Sair do Aplicativo</button>
  </div>

  <audio id="bemVindoAudio" src="BemVindo.mp3" preload="auto"></audio>

  <script>
    // Funções de áudio, sairDoApp, fecharModulo, etc. permanecem iguais
    function tocarBemVindo() {
      const audio = document.getElementById('bemVindoAudio');
      if (audio) {
        audio.volume = 0.5;
        audio.currentTime = 0;
        audio.play().then(() => console.log('BemVindo.mp3 tocando')).catch(e => console.log('Autoplay bloqueado:', e));
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.continuar-btn').addEventListener('click', tocarBemVindo);
    });

    function sairDoApp() {
      if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else if (window.cordova && cordova.plugins && cordova.plugins.exit) {
        cordova.plugins.exit();
      } else {
        window.close();
      }
    }

    // Todo o resto do script (getDiaSemana, fetchWeather, initMap, eventos de card, busca global, alerta, override window.open) permanece igual
    // ... cole aqui o seu script completo ...
  </script>

</body>
</html>
