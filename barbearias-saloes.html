<h2>Barbearias e Salões de Beleza na Mooca</h2>

<!-- Bloco de patrocínio exatamente igual ao de serviços automotivos -->
<div style="display: flex; align-items: center; justify-content: center; margin: 15px 0 25px 0; background: rgba(0, 212, 255, 0.08); padding: 12px; border-radius: 12px; border: 1px solid #00d4ff;">
  <a href="#" target="_blank" style="margin-right: 15px; display: block;">
    <img src="moocahub180.png" alt="Patrocinador" 
         style="width: 160px; height: 70px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,212,255,0.3);">
  </a>
  <p style="font-size: 1em; color: #00ffff; margin: 0; text-align: center;">
    Esse Módulo é Patrocinado pela<br><strong>[Nome do Patrocinador]</strong>
  </p>
</div>

<!-- Campo de pesquisa (igual serviços automotivos) -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Barbearias e Salões..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.lista-estabelecimentos button');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? '' : 'none';
    });
  });
</script>

<p style="text-align:center; margin-bottom:20px; font-size:1.1em; color:#00ffff;">
  As melhores barbearias e salões de beleza do bairro para ficar sempre no estilo!
</p>

<div class="lista-estabelecimentos">
  <!-- Lista de estabelecimentos - adicione os reais aqui -->
  <div class="padaria-bloco">
    <button class="padaria-btn" onclick="window.open('https://link-da-barbearia.com', '_blank')">
      Barbearia Exemplo Mooca <br>
      <small style="font-size: 0.85em; color: #ffffff; display: block; margin-top: 6px;">
        Rua da Mooca, 1234
      </small>
    </button>
  </div>

  <div class="padaria-bloco">
    <button class="padaria-btn" onclick="window.open('https://outro-link.com', '_blank')">
      Salão de Beleza Top <br>
      <small style="font-size: 0.85em; color: #ffffff; display: block; margin-top: 6px;">
        Rua Bresser, 567
      </small>
    </button>
  </div>

  <!-- Adicione mais itens aqui no mesmo formato -->
</div>

<button class="close-btn" onclick="fecharModulo()">Fechar</button>
